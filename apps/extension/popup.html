<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniFetch M8C PoC</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        min-width: 22rem;
        margin: 0;
        padding: 1rem;
      }
      h1 {
        font-size: 1rem;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.8rem;
        margin: 0 0 0.75rem;
        opacity: 0.8;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.8rem;
      }
      input {
        font: inherit;
        padding: 0.35rem 0.5rem;
      }
      .url-row {
        display: flex;
        gap: 0.5rem;
        margin: 0 0 0.75rem;
      }
      .url-row input {
        flex: 1 1 auto;
        min-width: 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      ul {
        list-style: none;
        margin: 0.75rem 0 0;
        padding: 0;
        font-size: 0.8rem;
      }
      li {
        border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        padding: 0.4rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UniFetch M8C authenticated PoC</h1>
      <p id="build" role="status">Checking build…</p>
      <p>
        Open a logged-in Instagram post, Reel or Story tab, then run an action.
        Optionally paste or type any Instagram post, Reel or Story URL to target
        it directly. Results are sanitized: no URLs, usernames, Story ids,
        captions or session data.
      </p>
      <div class="url-row">
        <input
          id="url-input"
          type="url"
          placeholder="Instagram URL"
          aria-label="Instagram URL"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="paste" type="button">Paste</button>
      </div>
      <div class="actions">
        <button id="resolve" type="button">Resolve</button>
        <button id="download" type="button">Download all</button>
        <button id="run" type="button">Run authenticated matrix</button>
        <button id="run-story" type="button">Run Story feasibility</button>
      </div>
      <p id="status" role="status">Idle.</p>
      <ul id="results"></ul>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
