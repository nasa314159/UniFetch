<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniFetch M8A PoC</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        min-width: 22rem;
        margin: 0;
        padding: 1rem;
      }
      h1 {
        font-size: 1rem;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.8rem;
        margin: 0 0 0.75rem;
        opacity: 0.8;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.8rem;
      }
      ul {
        list-style: none;
        margin: 0.75rem 0 0;
        padding: 0;
        font-size: 0.8rem;
      }
      li {
        border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        padding: 0.4rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UniFetch M8A authenticated PoC</h1>
      <p>
        Open a logged-in Instagram post or Reel tab, then run the matrix.
        Results are sanitized: no URLs, usernames, captions or session data.
      </p>
      <button id="run" type="button">Run authenticated matrix</button>
      <p id="status" role="status">Idle.</p>
      <ul id="results"></ul>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
